name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify project structure
        shell: bash
        run: |
          if [ ! -f package.json ]; then
            find . -name package.json -not -path "*/node_modules/*" | head -3
            echo "::error::package.json missing at repo root. Upload the FULL project (incl. src/) — not just the workflow."
            exit 1
          fi
          if [ ! -d src/app ]; then
            echo "::error::src/app missing! The src/ folder was not uploaded. Re-push the complete project via git."
            exit 1
          fi
          echo "Structure OK ✓"

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3

      - run: npm ci || npm install
      - run: npm run test:run
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: spending-tracker-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
